<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELLENCO | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="card login-box">
        <div class="brand" style="justify-content:center; margin-bottom: 18px;">
          <span class="brand-mark">E</span>
          <span>ELLENCO</span>
        </div>

        <div class="kicker" style="text-align:center;">Preparando sua operação...</div>
        <h2 style="text-align:center; margin-top: 12px;">Acesso ao sistema</h2>

        <form>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" value="admin@ellenco.com" />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" type="password" value="admin123" />
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-primary" style="width:100%;">Entrar</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
