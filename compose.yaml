name: ellenco-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ellenco}
      POSTGRES_USER: ${POSTGRES_USER:-ellenco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ellenco} -d ${POSTGRES_DB:-ellenco}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [ellenco_internal]

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ellenco}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ellenco}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ENABLED: "false"
      APP_URL: ${APP_URL:-http://localhost:5173}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ERP_API_URL: ${ERP_API_URL:-}
      ERP_API_TOKEN: ${ERP_API_TOKEN:-}
      RH_API_URL: ${RH_API_URL:-}
      RH_API_TOKEN: ${RH_API_TOKEN:-}
      SESMT_API_URL: ${SESMT_API_URL:-}
      SESMT_API_TOKEN: ${SESMT_API_TOKEN:-}
      ESOCIAL_API_URL: ${ESOCIAL_API_URL:-}
      ESOCIAL_API_TOKEN: ${ESOCIAL_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s
    restart: unless-stopped
    networks: [ellenco_internal]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5173}:80"
    restart: unless-stopped
    networks: [ellenco_internal]

volumes:
  postgres_data:

networks:
  ellenco_internal:
    driver: bridge
