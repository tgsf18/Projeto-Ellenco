spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONN_TIMEOUT:10000}
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

ellenco:
  bootstrap:
    enabled: ${ELLENCO_BOOTSTRAP_ENABLED:false}
    admin-email: ${ELLENCO_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${ELLENCO_BOOTSTRAP_ADMIN_PASSWORD:}
    reset-existing-admin: ${ELLENCO_BOOTSTRAP_RESET_EXISTING_ADMIN:false}
