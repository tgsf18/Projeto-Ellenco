spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ellenco_platform;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  # CONFIGURAÇÃO DOS RECURSOS ESTÁTICOS DO REACT
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/

server:
  # Alterado de 8083 para bater exatamente com a porta 8080 exigida pelo seu Dockerfile
  port: ${SERVER_PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET:EllencoSuperSecretJwtKeyForAuthentication2026Secure!}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

ellenco:
  bootstrap:
    enabled: false
  app-url: ${APP_URL:http://localhost:5173}

email:
  api-key: ${EMAIL_API_KEY:}
  from: ${EMAIL_FROM:}

integrations:
  erp: { url: "${ERP_API_URL:}", token: "${ERP_API_TOKEN:}" }
  rh: { url: "${RH_API_URL:}", token: "${RH_API_TOKEN:}" }
  sesmt: { url: "${SESMT_API_URL:}", token: "${SESMT_API_TOKEN:}" }
  esocial: { url: "${ESOCIAL_API_URL:}", token: "${ESOCIAL_API_TOKEN:}" }
